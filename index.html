<!-- Página principal para añadir tareas (pages/search.html para buscar tareas) -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Sweetalert script al final del body-->
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./styles.css">
    <title>Task Manager</title>
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
</head>

<body class="bg-light">
    <!-- Navigation -->
    <header>
        <div class="card">
            <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark p-3" data-bs-theme="dark">
                <div class="container">
                    <a class="navbar-brand" href="#">Gestor de Tareas</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="./index.html">Añadir Tarea</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./pages/search.html">Buscar Tarea</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
    </header>
    <!-- APPLICATION -->
    <main>
        <div class="container-fluid">
            <div class="row pt-4">
                
                <!-- FORM -->
                <div class="col-md-5 col-lg-4">
                    <div class="card text-bg-dark mb-4 p-2">
                        <form id="task-form" class="card-body p-4">
                            <h1 class="card-title text-center pb-3">
                                Agregar una tarea
                            </h1>
                            <div class="mb-3">
                                <label for="title" class="form-label">Título</label>
                                <input type="text" id="title" name="title" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label for="description" class="form-label">Descripción</label>
                                    <span id="description-help" class="form-text text-bg-dark me-2">* opcional</span>
                                </div>
                                <textarea id="description" name="description" class="form-control" rows="3" aria-describedby="description-help"></textarea>
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label for="datetime" class="form-label">Fecha y hora</label>
                                    <span id="datetime-help" class="form-text text-bg-dark me-2">* opcional</span>
                                </div>
                                <input type="datetime-local" id="datetime" name="datetime" class="form-control" aria-describedby="datetime-help">
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label for="place" class="form-label">Lugar</label>
                                    <span id="place-help" class="form-text text-bg-dark me-2">* opcional</span>
                                </div>
                                <textarea id="place" name="place" class="form-control" rows="1" aria-describedby="place-help"></textarea>
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label for="people" class="form-label">Personas</label>
                                    <span id="people-help" class="form-text text-bg-dark me-2">* opcional</span>
                                </div>
                                <textarea id="people" name="people" class="form-control" aria-describedby="people-help"></textarea>
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label for="materials" class="form-label">Materiales</label>
                                    <span id="materials-help" class="form-text text-bg-dark me-2">* opcional</span>
                                </div>
                                <textarea id="materials" name="materials" class="form-control" aria-describedby="materials-help"></textarea>
                            </div>
                            <!-- ALARM -->
                            <div class="text-center p-3 mb-1">
                                <h3 class="card-title">
                                    Agregar una alarma
                                </h3>
                                <div class="form-text text-bg-dark">
                                    * opcional
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="alarm-datetime" class="form-label">Fecha y hora</label>
                                <input type="datetime-local" id="alarm-datetime" name="alarm-datetime" class="form-control">
                            </div>
                            <!-- ALARM SELECT -->
                            <div>
                                <select id="alarm-select-input" name="alarm-select-input" class="form-select mb-3" aria-label="Select alarm sound">
                                    <option value="" selected>Choose alarm sound</option>
                                    <option value="0">Beep alarm sound</option>
                                    <option value="1">Loud alarm sound</option>
                                    <option value="2">Calm alarm music</option>
                                    <option value="3">Natural alarm sound</option>
                                    <option value="4">Please be alarmed</option>
                                    <option value="5">Dance style alarm</option>
                                    <option value="6">Beethoven style alarm</option>
                                    <option value="custom">Custom Alarm</option>
                                </select>                                
                                <div class="d-flex justify-content-center">
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                </div>
                            </div>
                            <!-- ALARM SEARCH -->
                            <div style="margin-bottom: 2.5rem;">
                                <div id="search-input-group" class="input-group px-4 pt-3 mb-3 d-none">
                                    <input id="search-input" type="text" name="search-input" class="form-control" placeholder="Search for sound" aria-describedby="search-submit">
                                    <input id="search-submit" type="image" src="./assets/search.png" alt="magnifying glass image, submit search"  class="input-group-text btn btn-light border">
                                </div>

                                <div id="search-carousel" class="carousel slide px-4 d-none">
                                    <div class="carousel-inner">
                                        <div class="carousel-item active">
                                            <img id="sound-image" src="" alt="sound wave drawing" class="d-block w-100 rounded">
                                            <div id="sound-title-container" class="carousel-caption">
                                                <h7 id="sound-title">Sound Name</h7>               
                                            </div>                                          
                                        </div>           
                                    </div>
                                    <img id="play-button" src="./assets/play.png" alt="play button">
                                    <button class="carousel-control-prev ps-4" type="button" data-bs-target="#carouselSearch" data-bs-slide="prev">
                                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                        <span class="visually-hidden">Previous</span>
                                    </button>
                                    <button class="carousel-control-next pe-4" type="button" data-bs-target="#carouselSearch" data-bs-slide="next">
                                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                        <span class="visually-hidden">Next</span>
                                    </button>
                                    <div id="search-audio-container">
                                        <!-- <audio class="search-audio-element"></audio> ... -->
                                    </div>
                                </div>
                            </div>

                            <div class="mb-2">
                                <input type="submit" value="save" class="btn btn-light w-100">
                            </div>
                        </form>
                    </div>
                </div>
    
                <!-- TASKS LIST -->
                <div class="col-md-7 col-lg-8" id="task-container" >
                    <!-- Generated in JS -->
                </div>
    
            </div>
        </div>
    </main>
    
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Sweetalert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Aplicacion -->
    <script src="./scripts/common-resources.js"></script>
    <script src="./scripts/main.js"></script>    
    <script src="./scripts/common-listeners.js"></script>
</body>

</html>
