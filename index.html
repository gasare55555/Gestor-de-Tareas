<!-- Main page to add tasks and set alarms (pages/search.html to serch for tasks) -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- spin.js-->
    <link rel="stylesheet" href="./styles/vendor/spin.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./styles/styles.css">
    <title>Task Manager</title>
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
</head>

<body class="bg-light">
    <!-- NAVIGATION -->
    <header>
        <div class="card">
            <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark p-3" data-bs-theme="dark">
                <div class="container">
                    <a class="navbar-brand mt-1" href="#">
                        <h5>Task Manager</h5>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="./index.html">Add Task</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./pages/search.html">Search for Task</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
    </header>
    <!-- MAIN -->
    <main>
        <div class="container-fluid">
            <div class="row py-4 px-1 gx-3 gy-4 my-4">
                
                <!-- FORM -->
                <div class="col-md-6 col-lg-4 mt-0">
                    <div class="card text-bg-dark p-2">
                        <form id="task-form" class="card-body p-4">
                            <h1 class="card-title text-center pb-3 mt-3">
                                Add Task
                            </h1>
                            <div class="mb-3">
                                <label for="title" class="form-label">Title</label>
                                <input type="text" id="title" name="title" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label for="description" class="form-label">Description</label>
                                    <span id="description-help" class="form-text text-bg-dark me-2">* optional</span>
                                </div>
                                <textarea id="description" name="description" class="form-control" rows="3" aria-describedby="description-help"></textarea>
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label for="datetime" class="form-label">Date and time</label>
                                    <span id="datetime-help" class="form-text text-bg-dark me-2">* optional</span>
                                </div>
                                <input type="datetime-local" id="datetime" name="datetime" class="form-control" aria-describedby="datetime-help">
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label for="place" class="form-label">Place</label>
                                    <span id="place-help" class="form-text text-bg-dark me-2">* optional</span>
                                </div>
                                <textarea id="place" name="place" class="form-control" rows="1" aria-describedby="place-help"></textarea>
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label for="people" class="form-label">People</label>
                                    <span id="people-help" class="form-text text-bg-dark me-2">* optional</span>
                                </div>
                                <textarea id="people" name="people" class="form-control" aria-describedby="people-help"></textarea>
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label for="materials" class="form-label">Materials</label>
                                    <span id="materials-help" class="form-text text-bg-dark me-2">* optional</span>
                                </div>
                                <textarea id="materials" name="materials" class="form-control" aria-describedby="materials-help"></textarea>
                            </div>

                            <!-- ALARM -->
                            <div class="text-center p-3 mb-1">
                                <h1 class="card-title mt-3">
                                    Add Alarm
                                </h1>
                                <div class="form-text text-bg-dark">
                                    * optional
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="alarm-datetime" class="form-label">Date and time</label>
                                <input type="datetime-local" id="alarm-datetime" name="alarm-datetime" class="form-control">
                            </div>
                            <!-- ALARM SELECT -->
                            <div>
                                <select id="alarm-select-input" name="alarm-select-input" class="form-select mb-3" aria-label="Select alarm sound">
                                    <option value="" selected>Select default sound</option>
                                    <option value="0">Beep alarm sound</option>
                                    <option value="1">Loud alarm sound</option>
                                    <option value="2">Calm alarm music</option>
                                    <option value="3">Natural alarm sound</option>
                                    <option value="4">Please be alarmed</option>
                                    <option value="5">Dance style alarm</option>
                                    <option value="6">Beethoven style alarm</option>
                                </select>                                
                            </div>
                            <!-- ALARM SEARCH -->
                            <div style="margin-bottom: 3.4rem;">
                                <div id="search-input-group" class="input-group mb-3">
                                    <input id="search-input" type="text" name="search-input" class="form-control" placeholder="Search for custom sound" aria-describedby="search-submit">
                                    <input id="search-submit" type="image" src="./assets/search.png" alt="magnifying glass image, submit search"  class="input-group-text btn btn-light border">
                                </div>
                                <!-- SELECT AUDIO ELEMENTS -->
                                <div class="d-flex justify-content-center">
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                    <audio class="select-audio-element border rounded-4 bg-light mb-3"></audio>
                                </div>
                                <!-- SEARCH CAROUSEL AND LOADER -->
                                <div style="position: relative; padding-top: 2.4rem;">
                                    <div id="search-spinner-container" class="d-none"></div>

                                    <div id="search-carousel" class="carousel slide px-2 d-none fade transition">              
                                        <div class="carousel-inner rounded">
                                            <div class="carousel-item active">
                                                <img id="sound-image" src="" alt="sound wave drawing" class="d-block w-100 rounded">
                                                <div id="sound-title-container" class="carousel-caption">
                                                    <h7 id="sound-title">Sound Name</h7>            
                                                </div>                            
                                            </div>           
                                        </div>
                                        <img id="play-button" src="./assets/play.png" alt="play button">
                                        <button id="prev-button" class="carousel-control-prev ps-4" type="button" data-bs-target="#carouselSearch" data-bs-slide="prev">
                                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                            <span class="visually-hidden">Previous</span>
                                        </button>
                                        <button id="next-button" class="carousel-control-next pe-4" type="button" data-bs-target="#carouselSearch" data-bs-slide="next">
                                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                            <span class="visually-hidden">Next</span>
                                        </button>
                                        <div id="search-audio-container">
                                            <!-- <audio class="search-audio-element"></audio> ... -->
                                        </div>
                                        <div id="search-alarm-container">
                                            <!-- <audio class="search-alarm-element"></audio> ... -->
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-2">
                                <input type="submit" value="Save Task" class="btn btn-light w-100 mb-3">
                            </div>
                        </form>
                    </div>
                </div>
    
                <!-- TASK LIST -->
                <div class="col-md-6 col-lg-8 mt-0" id="task-container" >
                    <!-- Generated in JS -->
                </div>
    
            </div>
        </div>
    </main>
    
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Sweetalert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- App -->
    <script type="module" src="./scripts/pages/home.js"></script>
</body>

</html>
